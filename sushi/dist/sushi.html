ings.export.none":"還沒有無限模式的存檔","settings.import.ok":"匯入完成","settings.import.bad":"這個檔案不是無限模式的存檔","settings.confirm":"確定要刪除嗎？這個動作不能復原。","settings.done":"已重設","settings.on":"開","settings.off":"關","tut.1.buyTab":"先進貨。點「進貨」分頁。","tut.1.suggest":"點「建議量」。系統會照預估的來客數填好數量。","tut.1.buy":"點「進貨」付錢。食材馬上入庫。","tut.1.menu":"「菜單」分頁可以決定賣什麼、賣多少錢。現在先用預設值。","tut.1.open":"準備好了就按「開店」。開店後時間開始走。","tut.1.speed":"這裡調整時間的速度：暫停、1 倍、2 倍、4 倍。","tut.1.goal":"打烊時，營業額要達到目標。點店裡的客人可以看他的想法。","hint.2.bars":"從今天起要跟憂鬱比營業額。這裡隨時看得到雙方的數字。","hint.2.price":"售價可以調。貴一點賺得多，但是客人會不滿意，太貴就不點了。","hint.3.staff":"本田還在休息。到「員工」分頁把他排到「外場」，他會幫忙送餐到桌位。","hint.3.restock":"庫存上限是 200 貫。賣得好的話，營業中要記得補貨。","hint.3.bucho":"部長進店時，這裡會出現「變裝」鈕。部長離開後記得解除，變裝時捏得比較慢。","hint.4.fac":"「設施」分頁可以調整每一台小鋼珠台。","hint.4.nail":"釘子設定 1 最緊，5 最鬆。越鬆，鋼珠越容易進ヘソ，大當機率也越高。客人越常贏，口碑越好，來玩的人越多，但送出去的壽司也越多。","hint.4.trial":"按「試玩」可以親手玩一局。試玩不收錢，也不影響店裡。開店前先摸一下手感吧。","hint.4.terai":"這一關多了寺井。他預設在休息。到「員工」分頁把他排到第二座板前檯，出餐才夠快。","hint.8.modes":"每個品項可以選賣法：「高級」用好魚；「平價」用便宜魚老實賣，客人心裡的價位也比較低；「魚目混珠」用便宜魚假裝高級貨，有機率被吃出來。","hint.8.sell":"中川送的高級魚可以在「進貨」分頁賣掉，換回八成的現金。便宜魚也在這裡買。","hint.8.uniform":"「設施」分頁可以掛上均一價招牌：全部賣 ¥300，來客變多。但高級魚賣 ¥300 會賠錢。","hint.9.lemon":"檸檬來之前 30 分鐘會有預告。她會試吃 3 個品項，魚目混珠一定被吃出來，當日營業額會少三成。","hint.9.modes":"收到預告之後，把魚目混珠的品項改回「高級」或「平價」。改回高級需要有高級食材的庫存。","hint.10.all":"今天職業玩家、部長、修馬哈、檸檬都會來。留意下方的通知，一個一個應付。","hint.5.pro":"職業玩家坐上機台時會跳出選單：放任、調緊釘子，或是親自應戰。","hint.6.fac":"「設施」分頁多了賽車機台。","hint.6.level":"客人開的是小黃瓜捲。過終點時贏過哪台壽司車，就送他那一款壽司。「難度」越高，壽司車越快，獎品送得少，但口碑也會變差。","hint.6.trial":"按「試玩」親手跑一場：← → 轉向、↑ 加速、空白鍵山葵噴射。試玩不收錢。","hint.7.shumaha":"修馬哈坐上機台時會跳出選單。親自應戰的話，要乾淨過彎，並在直線上用山葵噴射。","hint.5.stock":"獎品會用掉食材，大獎特別吃高級貨。沒貨的時候只能發招待券，評價會下降。","lv.1.intro.1":"超神田壽司要開分店了。勘吉，這間店先交給你試試。","lv.1.intro.2":"包在我身上！開店第一天就讓客人排到街尾！（然後分紅就是我的了，嘿嘿嘿）","lv.1.intro.3":"先別作夢。今天只開到下午三點。目標是營業額一萬兩千圓。","lv.1.intro.4":"先進貨，再開店。做不到的話，你就回派出所站崗。","lv.1.pass.1":"哼。還算像樣。","lv.1.pass.2":"這不是輕輕鬆鬆嗎！從明天起，請叫我分店長！","lv.1.pass.3":"……我有不好的預感。","lv.1.fail.1":"連這點營業額都做不到？","lv.1.fail.2":"再、再給我一次機會！剛才只是熱身！","lv.2.intro.1":"勘吉，不好了。大哥憂鬱修行回來了。","lv.2.intro.2":"奶奶。分店應該交給正統的壽司師傅。也就是我。","lv.2.intro.3":"那就用營業額決定。賣得多的人拿分店。","lv.2.intro.4":"什麼！到手的分店要飛了！……哼，比就比，誰怕誰！","lv.2.intro.5":"畫面下方看得到雙方的營業額。價錢可以自己調，但是太貴客人會跑掉。","lv.2.pass.1":"怎麼可能……我的握壽司，竟然輸給這個外行人……","lv.2.pass.2":"哇哈哈哈！這就是下町的實力！","lv.2.pass.3":"只贏一天不算數。明天繼續比。","lv.2.fail.1":"這就是修行的成果。","lv.2.fail.2":"可惡……明天！明天一定贏回來！","lv.3.intro.1":"一個人忙不過來。本田！日薪五千圓，過來幫忙！","lv.3.intro.2":"前、前輩……我只會騎車，不會捏壽司啊……","lv.3.intro.3":"今天多了桌位，也會有外國觀光客。桌位離板前檯遠，要有人送餐。","lv.3.intro.4":"對了。聽說大原部長今天會來吃飯。警察不能兼差，被他認出來就完蛋了……","lv.3.intro.5":"部長來的時候按「變裝」。你就是板前師傅「淺草一郎」。","lv.3.pass.1":"前輩！我今天一盤都沒有打翻！","lv.3.pass.2":"很好很好，日薪照給。（部長那邊也矇混過去了，呼……）","lv.3.fail.1":"本田！你為什麼把壽司捏成飯糰！","lv.3.fail.2":"對不起前輩——！","lv.4.intro.1":"中川！你們公司的小鋼珠台借我三台！客人玩完還會想再吃，這叫相乘效果！","lv.4.intro.2":"前輩，壽司店放小鋼珠台……真的可以嗎？……算了，我叫人早上就搬過去。","lv.4.intro.3":"鋼珠打進中間的ヘソ，螢幕的數字就會轉！三個一樣就是大當，贏到的鋼珠全部換成壽司！","lv.4.intro.4":"兩津，釘子調太鬆的話，壽司會被送光喔。設定越高，客人越容易贏。","lv.4.intro.5":"知道啦！開店前先親手試玩一次，摸摸手感。","lv.4.pass.1":"嘿嘿，入場費一直進來！這就是兩津式經營學！","lv.4.pass.2":"高級食材也一直出去喔……","lv.4.pass.3":"壽司店竟然靠打彈珠贏我……這不是正統的壽司。","lv.4.fail.1":"客人是來吃壽司的，不是來打彈珠的。","lv.4.fail.2":"可惡！一定是釘子沒調好！","lv.5.intro.1":"兩津，網路上說你店裡的小鋼珠很好贏。今天好像會有職業玩家來喔。","lv.5.intro.2":"什麼！那些傢伙會把高級食材全部打走的！","lv.5.intro.3":"……聽說這裡的機台很鬆。今天的晚餐，就麻煩你了。","lv.5.intro.4":"休想！看我把釘子調緊，不然就親自跟你比一場！","lv.5.intro.5":"職業玩家坐上機台時，可以選擇對策。獎品會用掉食材，別忘了補貨。","lv.5.pass.1":"……這家店的老闆，不簡單。","lv.5.pass.2":"哇哈哈哈！論小鋼珠，我可是專家！","lv.5.pass.3":"兩津，你是警察吧……","lv.5.fail.1":"多謝招待。特上拼盤很好吃。","lv.5.fail.2":"我的大腹……我的海膽……全部被吃光了！","lv.6.intro.1":"小鋼珠賺到錢了！下一步是這個──賽車機台！畫面裡每台車都載著一款壽司！","lv.6.intro.2":"前輩，這台機台是我調校的！一握住方向盤，我就會變成另一個人喔！","lv.6.intro.3":"客人付入場費，開最便宜的小黃瓜捲。贏過哪台壽司車，就送他那一款！贏過大腹就吃大腹！","lv.6.intro.4":"「難度」調得越高，壽司車越快，客人越難贏。調太高的話，客人會覺得沒意思喔。","lv.6.intro.5":"開店前先試跑一場，看看大腹跑得有多快！","lv.6.pass.1":"前輩！客人用小黃瓜捲贏過鮪魚，開心得又點了一盤！","lv.6.pass.2":"哇哈哈！壽司加賽車，這就是未來的壽司店！","lv.6.pass.3":"……握壽司不是用車子載的。","lv.6.fail.1":"客人都在看車，沒有人在看壽司。","lv.6.fail.2":"可惡！一定是壽司車太慢了！本田，再改快一點！","lv.7.intro.1":"兩津，聽說有一位很有名的賽車手要來你的店。","lv.7.intro.2":"有名的賽車手？來玩賽車機台？","lv.7.intro.3":"…………（默默戴好安全帽，握住了方向盤）","lv.7.intro.4":"這傢伙是認真的！開小黃瓜捲把大腹都贏走，跑 8 場就是 8 貫大腹！","lv.7.intro.5":"他報名時可以選對策。對了，部長今天也會來，別忘了變裝。","lv.7.pass.1":"…………（豎起大拇指）","lv.7.pass.2":"連世界級的車手都服了我的店！","lv.7.pass.3":"他只是吃飽了而已吧……","lv.7.fail.1":"…………（抱著一整排大腹離開）","lv.7.fail.2":"一句話都不說，就把壽司全部載走了！","lv.8.intro.1":"前輩，中川水產送來一批最高級的黑鮪魚和海膽，請拿去用吧。","lv.8.intro.2":"喔喔！這一批值不少錢吧？……等等，把它賣掉換現金，再去魚市場買便宜的魚不就好了！","lv.8.intro.3":"前、前輩？那是我特地準備的……","lv.8.intro.4":"再掛上「全品項 ¥300 均一」的招牌，客人一定擠破門！","lv.8.intro.5":"前輩，旗魚和黑鮪魚吃起來不一樣吧？美食家會吃出來的……","lv.8.intro.6":"囉嗦！要標「平價」老實賣，還是魚目混珠賭一把，由我決定！","lv.8.pass.1":"哇哈哈！營業額贏了！做生意就是要靠頭腦！","lv.8.pass.2":"前輩……我送的魚，客人有吃到嗎？","lv.8.pass.3":"你最好祈禱沒有人吃出來。","lv.8.fail.1":"好的食材，要用正直的心去捏。","lv.8.fail.2":"少說教了！明天我一定贏回來！","lv.9.intro.1":"阿兩，檸檬說今天要來你的店試吃。","lv.9.intro.2":"檸、檸檬！？那個小鬼的舌頭，連醬油換了牌子都吃得出來……","lv.9.intro.3":"勘吉捏的壽司，檸檬要好好確認。","lv.9.intro.4":"（糟了。她來之前，一定要把魚目混珠的品項改回來……）","lv.9.intro.5":"你剛剛是不是在想什麼不能說的事？","lv.9.pass.1":"嗯。是好吃的壽司。","lv.9.pass.2":"呼……壽命少了十年。","lv.9.pass.3":"哼。看來還有一點真工夫。","lv.9.fail.1":"勘吉，今天的店不及格。","lv.9.fail.2":"連幼稚園的小朋友都在對我說教……","lv.10.intro.1":"今天是最後一天。營業額高的人，拿走分店的暖簾。","lv.10.intro.2":"我會用正統的江戶前壽司，堂堂正正地贏。","lv.10.intro.3":"我這邊有小鋼珠、有賽車、有均一價！全部一起上！","lv.10.intro.4":"聽說職業玩家、修馬哈、部長和檸檬，今天都會來。","lv.10.intro.5":"……為什麼偏偏都挑今天！","lv.10.intro.6":"讓我看看你的真工夫。","lv.10.pass.1":"營業額是你贏。不過這間店還有進步的空間。","lv.10.pass.2":"贏了就是贏了！","lv.10.pass.3":"想讓奶奶真心認可，就拿三顆星給她看吧。","lv.10.fail.1":"承讓了。分店由我收下。","lv.10.fail.2":"兩津！你這個大笨蛋！竟然瞞著我兼差！給我回派出所寫悔過書！","lv.10.fail.3":"嗚哇啊啊！店沒了還要被罵！","lv.10.tie.1":"勘吉的大腹是旗魚。","lv.10.tie.2":"嗚！……這、這是誤會！","lv.10.tie.3":"營業額是你高。但是靠假貨贏的不算數。這一場算平手。","lv.10.tie.4":"我竟然跟賣旗魚的店打成平手……我的修行還不夠。我要再出門修行。","lv.10.tie.5":"哥哥又走了。這樣分店的事也沒了。","lv.10.tie.6":"什麼！？那我這幾天到底在忙什麼啊！","lv.10.perfect.1":"評價沒有掉，也沒有動手腳。兩津，這就是你的真工夫。我認可你。","lv.10.perfect.2":"喔喔喔！那分店就是我的了！","lv.10.perfect.3":"輸給外行人……我的修行還不夠。我要再出門修行。分店的事，請等我回來再說。","lv.10.perfect.4":"……哥哥走了。奶奶說，分店的事等他回來再談。","lv.10.perfect.5":"不甘心啊啊啊！把我的分店還來！","sprite.race.car.kappa":"小黃瓜捲車（玩家）","sprite.race.car.tamago":"玉子車","sprite.race.car.sake":"鮭魚車","sprite.race.car.
