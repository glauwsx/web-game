<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鋼框 STEELRIM｜五對五全場籃球</title>
  <meta name="description" content="原創網頁 3D 籃球遊戲，支援 Xbox、PlayStation、Switch Pro 手把與鍵盤。">
  <link rel="stylesheet" href="./src/style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="fade"></div>
  <div id="hud" class="hidden">
    <div id="scoreboard"></div>
    <div id="banner"></div>
    <div id="overlay-markers"></div>
    <div id="meter"><div class="meter-fill"></div><div class="meter-zone"></div><div class="meter-label"></div></div>
    <div id="hints"></div>
    <div id="ticker"></div>
  </div>
  <div id="screens"></div>
  <div id="toasts"></div>
  <noscript>這個遊戲需要開啟 JavaScript。</noscript>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
