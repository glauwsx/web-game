<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DualSense 手把測試</title>
<style>
  :root { --bg:#12141a; --panel:#1c2029; --line:#2e3442; --text:#e8eaf0; --dim:#9099ab; --accent:#4c8dff; --ok:#3ecf8e; --warn:#ffb454; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, "Noto Sans TC", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: var(--dim); margin: 0 0 20px; font-size: 14px; }
  .bar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 16px; font-size:15px; cursor:pointer; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--text); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  #status { font-size:14px; color:var(--dim); }
  #status.ok { color:var(--ok); } #status.warn { color:var(--warn); }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .card h2 { margin:0 0 12px; font-size:17px; display:flex; justify-content:space-between; }
  .card h2 span { color:var(--dim); font-weight:400; font-size:13px; }
  label { display:block; font-size:13px; color:var(--dim); margin:12px 0 4px; }
  label b { color:var(--text); float:right; font-variant-numeric: tabular-nums; }
  select, input[type=range] { width:100%; }
  select { background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:8px; font-size:15px; }
  .meter { height:14px; background:var(--bg); border-radius:7px; overflow:hidden; border:1px solid var(--line); position:relative; }
  .meter i { display:block; height:100%; width:0; background:var(--accent); }
  .zone { position:absolute; top:0; height:100%; background:rgba(255,180,84,.35); pointer-events:none; }
  .hint { font-size:12px; color:var(--dim); margin-top:10px; min-height:36px; }
  .row { display:flex; gap:12px; align-items:center; margin:16px 0; flex-wrap:wrap; font-size:14px; }
  .presets { display:flex; gap:8px; flex-wrap:wrap; }
  .presets button { padding:6px 12px; font-size:13px; }
  pre { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px; font-size:12px; color:var(--dim); overflow:auto; margin:8px 0 0; }
  .hidden { display:none; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chips span { font-size:12px; padding:2px 8px; border:1px solid var(--line); border-radius:999px; color:var(--dim); }
  .chips span.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .pad { position:relative; width:100%; aspect-ratio:16/9; background:var(--bg); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .pad.click { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent) inset; }
  .finger { position:absolute; width:28px; height:28px; margin:-14px 0 0 -14px; border-radius:50%; display:none; align-items:center; justify-content:center; font-size:12px; color:#fff; }
  .finger.f0 { background:var(--accent); } .finger.f1 { background:#e8735b; }
  .aim { position:relative; width:100%; aspect-ratio:16/9; background:var(--bg); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .aim::before, .aim::after { content:''; position:absolute; background:var(--line); }
  .aim::before { left:50%; top:0; bottom:0; width:1px; } .aim::after { top:50%; left:0; right:0; height:1px; }
  #dot { position:absolute; left:50%; top:50%; width:18px; height:18px; margin:-9px 0 0 -9px; border:2px solid var(--ok); border-radius:50%; }
  .nums { font:12px/1.6 ui-monospace, monospace; color:var(--dim); margin-top:8px; white-space:pre; overflow:auto; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .btns button { padding:6px 12px; font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>DualSense 手把測試</h1>
  <p class="sub">用 WebHID 測試扳機阻力、燈光、震動、觸控板、陀螺儀。需要電腦版 Chrome 或 Edge。USB 與藍牙都支援。</p>

  <div class="bar">
    <button id="connect">連接手把</button>
    <button id="reset" class="ghost" disabled>關閉全部阻力</button>
    <span id="status">尚未連接</span>
  </div>

  <div class="row">
    <label style="margin:0;display:flex;gap:6px;align-items:center;color:var(--text)">
      <input type="checkbox" id="link"> L2 與 R2 使用相同設定
    </label>
    <div class="presets">
      <button class="ghost" data-preset="soft">輕阻力</button>
      <button class="ghost" data-preset="hard">重阻力</button>
      <button class="ghost" data-preset="gun">手槍扳機</button>
      <button class="ghost" data-preset="bow">拉弓</button>
      <button class="ghost" data-preset="engine">引擎震動</button>
      <button class="ghost" data-preset="rawmax">原始最強</button>
    </div>
  </div>

  <div class="grid" id="cards"></div>

  <div class="card" style="margin-top:16px">
    <h2>燈光</h2>
    <div class="row" style="margin:0">
      <label style="margin:0;color:var(--text)">燈條顏色 <input type="color" id="color" value="#0050ff" style="vertical-align:middle"></label>
      <span id="leds" style="display:flex;gap:6px;align-items:center">玩家指示燈
        <input type="checkbox" data-bit="1"><input type="checkbox" data-bit="2"><input type="checkbox" data-bit="4" checked><input type="checkbox" data-bit="8"><input type="checkbox" data-bit="16">
      </span>
      <label style="margin:0;color:var(--text)">麥克風燈
        <select id="mic" style="width:auto"><option value="0">關</option><option value="1">亮</option><option value="2">呼吸</option></select>
      </label>
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <h2>震動馬達（Rumble）<span>拉滑桿會持續震動</span></h2>
    <div class="grid">
      <div><label>左馬達：重、低頻 <b id="rlv">0</b></label><input type="range" id="rumL" min="0" max="255" value="0"></div>
      <div><label>右馬達：輕、高頻 <b id="rrv">0</b></label><input type="range" id="rumR" min="0" max="255" value="0"></div>
    </div>
    <div class="btns">
      <button class="ghost" data-pulse="255,0,150">重擊</button>
      <button class="ghost" data-pulse="0,255,80">輕點</button>
      <button class="ghost" data-pulse="200,200,400">爆炸</button>
      <button class="ghost" data-pulse="heartbeat">心跳</button>
      <button class="ghost" id="rumOff">停止震動</button>
    </div>
  </div>

  <div class="grid" style="margin-top:16px">
    <div class="card">
      <h2>觸控板（Touchpad）<span id="tpinfo">—</span></h2>
      <div class="pad" id="pad"><div class="finger f0">1</div><div class="finger f1">2</div></div>
      <div class="hint">最多追蹤 2 根手指。整片按下去時，外框會變藍。座標範圍 0–1919 × 0–1079。</div>
    </div>
    <div class="card">
      <h2>陀螺儀（Gyro）<span>轉動手把移動準心</span></h2>
      <div class="aim" id="aim"><div id="dot"></div></div>
      <div class="btns"><button class="ghost" id="recenter">準心歸位</button><button class="ghost" id="calib">校正漂移（手把放平靜止）</button></div>
      <label style="display:flex;gap:6px;align-items:center;margin-top:8px"><input type="checkbox" id="invX">左右反向 <input type="checkbox" id="invY">上下反向</label>
      <div class="nums" id="motion">—</div>
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <h2>按鈕<span id="battery">電量 —</span></h2>
    <div class="chips" id="chips"></div>
    <div class="nums" id="sticks">—</div>
  </div>

  <details style="margin-top:16px">
    <summary style="cursor:pointer;color:var(--dim);font-size:13px">除錯資訊</summary>
    <pre id="debug">—</pre>
  </details>
</main>

<template id="tpl">
  <div class="card">
    <h2><em style="font-style:normal" class="name"></em><span>按壓量 <b class="val">0</b></span></h2>
    <div class="meter"><i></i><div class="zone"></div></div>
    <label>模式</label>
    <select class="mode">
      <option value="off">關閉</option>
      <option value="feedback" selected>持續阻力（Feedback）</option>
      <option value="weapon">扳機段落（Weapon）</option>
      <option value="vibration">震動（Vibration）</option>
      <option value="rawFeedback">原始持續阻力（0x01，0–255）</option>
      <option value="rawWeapon">原始扳機段落（0x02，0–255）</option>
    </select>
    <div class="p p-start"><label>起始位置 <b></b></label><input type="range" class="start" min="0" max="9" value="2"></div>
    <div class="p p-end"><label>結束位置 <b></b></label><input type="range" class="end" min="1" max="8" value="5"></div>
    <div class="p p-force"><label>強度 <b></b></label><input type="range" class="force" min="1" max="8" value="5"></div>
    <div class="p p-freq"><label>頻率（Hz） <b></b></label><input type="range" class="freq" min="1" max="255" value="20"></div>
    <div class="hint"></div>
  </div>
</template>

<script>
const VENDOR = 0x054c;
const PRODUCTS = [0x0ce6, 0x0df2]; // DualSense, DualSense Edge
const $ = (s, r = document) => r.querySelector(s);
const statusEl = $('#status'), debugEl = $('#debug');

let device = null, bluetooth = false, seq = 0, sendTimer = null, lightSetup = true;
const rumble = { l: 0, r: 0 };

// ---------- 扳機效果編碼（每個扳機 11 bytes：模式 + 10 個參數） ----------
function encodeEffect(c) {
  const b = new Uint8Array(11);
  if (c.mode === 'off') { b[0] = 0x05; return b; }

  if (c.mode === 'feedback') {
    // 從 start 區到底，每一區都有相同強度的阻力
    let active = 0, force = 0;
    for (let i = c.start; i < 10; i++) { active |= 1 << i; force += (c.force - 1) * 2 ** (3 * i); }
    b[0] = 0x21; b[1] = active & 0xff; b[2] = active >> 8;
    for (let i = 0; i < 4; i++) b[3 + i] = Math.floor(force / 2 ** (8 * i)) & 0xff;
  } else if (c.mode === 'weapon') {
    // start 到 end 之間有阻力，壓過 end 後瞬間放開
    const zones = (1 << c.start) | (1 << c.end);
    b[0] = 0x25; b[1] = zones & 0xff; b[2] = zones >> 8; b[3] = c.force - 1;
  } else if (c.mode === 'vibration') {
    let active = 0, amp = 0;
    for (let i = c.start; i < 10; i++) { active |= 1 << i; amp += (c.force - 1) * 2 ** (3 * i); }
    b[0] = 0x26; b[1] = active & 0xff; b[2] = active >> 8;
    for (let i = 0; i < 4; i++) b[3 + i] = Math.floor(amp / 2 ** (8 * i)) & 0xff;
    b[9] = c.freq;
  } else if (c.mode === 'rawFeedback') {
    // 舊版模式：位置與強度都是 0–255
    b[0] = 0x01; b[1] = c.start; b[2] = c.force;
  } else if (c.mode === 'rawWeapon') {
    b[0] = 0x02; b[1] = c.start; b[2] = c.end; b[3] = c.force;
  }
  return b;
}

// ---------- 輸出報告 ----------
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(bytes) {
  let c = 0xffffffff;
  for (const x of bytes) c = CRC_TABLE[(c ^ x) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}

function buildCommon(left, right) {
  const p = new Uint8Array(47);
  p[0] = 0x04 | 0x08;          // 允許修改右扳機與左扳機
  p[0] |= 0x01 | 0x02;         // 允許修改震動馬達
  p[1] = 0x01 | 0x04 | 0x10;   // 允許修改麥克風燈、燈條、玩家指示燈
  p[2] = rumble.r; p[3] = rumble.l;
  p[8] = +$('#mic').value;
  p[38] = 0x04;                // 新版韌體的震動相容模式
  if (lightSetup) { p[38] |= 0x02; p[41] = 0x02; lightSetup = false; } // 連接後送一次：關掉藍牙配對的藍色動畫
  let leds = 0;
  document.querySelectorAll('#leds input:checked').forEach(x => leds |= +x.dataset.bit);
  p[43] = leds | 0x20;         // 0x20 = 立即切換，不淡入
  const rgb = parseInt($('#color').value.slice(1), 16);
  p[44] = rgb >> 16; p[45] = (rgb >> 8) & 0xff; p[46] = rgb & 0xff;
  p.set(encodeEffect(right), 10);
  p.set(encodeEffect(left), 21);
  return p;
}

async function send() {
  if (!device?.opened) return;
  const common = buildCommon(readCfg('L2'), readCfg('R2'));
  try {
    if (!bluetooth) {
      await device.sendReport(0x02, common);
      debugEl.textContent = 'USB 0x02\n' + hex(common);
    } else {
      const data = new Uint8Array(77);
      data[0] = (seq << 4) & 0xf0; seq = (seq + 1) & 0x0f;
      data[1] = 0x10;
      data.set(common, 2);
      const crc = crc32([0xa2, 0x31, ...data.subarray(0, 73)]);
      new DataView(data.buffer).setUint32(73, crc, true);
      await device.sendReport(0x31, data);
      debugEl.textContent = 'Bluetooth 0x31\n' + hex(data);
    }
  } catch (e) {
    setStatus('傳送失敗：' + e.message, 'warn');
  }
}
const hex = a => [...a].map(x => x.toString(16).padStart(2, '0')).join(' ');
function queueSend() { clearTimeout(sendTimer); sendTimer = setTimeout(send, 30); }

// ---------- 連接 ----------
function setStatus(t, cls = '') { statusEl.textContent = t; statusEl.className = cls; }

async function openDevice(d) {
  device = d;
  if (!d.opened) await d.open();
  bluetooth = d.collections.some(c => (c.outputReports || []).some(r => r.reportId === 0x31));
  if (bluetooth) { try { await d.receiveFeatureReport(0x05); } catch {} } // 切換到完整報告模式
  lightSetup = true;
  d.addEventListener('inputreport', onInput);
  $('#reset').disabled = false;
  setStatus(`已連接：${d.productName}（${bluetooth ? '藍牙' : 'USB'}）`, 'ok');
  send();
}

// 輸入狀態：每個報告更新 st，畫面用 requestAnimationFrame 讀取
const st = { l2: 0, r2: 0, full: false, lx: 128, ly: 128, rx: 128, ry: 128, b: [8, 0, 0], touch: [null, null],
  gyro: [0, 0, 0], accel: [0, 0, 0], battery: -1, charging: 0 };
const bias = [0, 0, 0];
const aim = { x: 0, y: 0 };
let lastT = 0, calibSamples = null;

function onInput(e) {
  const v = e.data;
  let o;                                            // 完整報告裡搖桿資料的起點
  if (e.reportId === 0x01 && v.byteLength >= 60) o = 0;   // USB
  else if (e.reportId === 0x31) o = 1;                   // 藍牙完整報告
  else if (e.reportId === 0x01) {                        // 藍牙簡易報告：只有按鈕與扳機
    st.full = false; st.l2 = v.getUint8(7); st.r2 = v.getUint8(8); return;
  } else return;
  st.full = true;
  st.lx = v.getUint8(o); st.ly = v.getUint8(o + 1); st.rx = v.getUint8(o + 2); st.ry = v.getUint8(o + 3);
  st.l2 = v.getUint8(o + 4); st.r2 = v.getUint8(o + 5);
  st.b = [v.getUint8(o + 7), v.getUint8(o + 8), v.getUint8(o + 9)];
  for (let k = 0; k < 3; k++) {
    st.gyro[k] = v.getInt16(o + 15 + 2 * k, true) / 1024;   // 約 1024 = 1 度/秒（未用出廠校正值）
    st.accel[k] = v.getInt16(o + 21 + 2 * k, true) / 8192; // 約 8192 = 1 g
  }
  for (let f = 0; f < 2; f++) {
    const a = o + 32 + 4 * f, c = v.getUint8(a);
    st.touch[f] = c & 0x80 ? null : {
      id: c & 0x7f,
      x: v.getUint8(a + 1) | (v.getUint8(a + 2) & 0x0f) << 8,
      y: v.getUint8(a + 2) >> 4 | v.getUint8(a + 3) << 4,
    };
  }
  const status = v.getUint8(o + 52);
  st.battery = Math.min(100, (status & 0x0f) * 10 + 5); st.charging = status >> 4;

  // 陀螺儀積分成準心位置
  const now = performance.now(), dt = lastT ? Math.min(0.05, (now - lastT) / 1000) : 0;
  lastT = now;
  if (calibSamples) {
    calibSamples.push([...st.gyro]);
    if (calibSamples.length >= 200) {
      for (let k = 0; k < 3; k++) bias[k] = calibSamples.reduce((s, g) => s + g[k], 0) / calibSamples.length;
      calibSamples = null; aim.x = aim.y = 0;
      $('#calib').textContent = '校正漂移（手把放平靜止）';
    }
    return;
  }
  const yaw = st.gyro[1] - bias[1], pitch = st.gyro[0] - bias[0];
  aim.x = clamp(aim.x - yaw * dt * ($('#invX').checked ? -1 : 1), -40, 40);   // 單位：度
  aim.y = clamp(aim.y - pitch * dt * ($('#invY').checked ? -1 : 1), -22.5, 22.5);
}
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

const BTN = [
  ['□', 0, 0x10], ['✕', 0, 0x20], ['○', 0, 0x40], ['△', 0, 0x80],
  ['L1', 1, 0x01], ['R1', 1, 0x02], ['L2', 1, 0x04], ['R2', 1, 0x08],
  ['Create', 1, 0x10], ['Options', 1, 0x20], ['L3', 1, 0x40], ['R3', 1, 0x80],
  ['PS', 2, 0x01], ['觸控板按下', 2, 0x02], ['靜音鍵', 2, 0x04],
];
const DPAD = ['↑', '↗', '→', '↘', '↓', '↙', '←', '↖'];
$('#chips').innerHTML = ['十字鍵 —', ...BTN.map(b => b[0])].map(t => `<span>${t}</span>`).join('');
const chipEls = [...document.querySelectorAll('#chips span')];

function render() {
  setMeter('L2', st.l2); setMeter('R2', st.r2);
  const hat = st.b[0] & 0x0f;
  chipEls[0].textContent = '十字鍵 ' + (hat < 8 ? DPAD[hat] : '—'); chipEls[0].classList.toggle('on', hat < 8);
  BTN.forEach(([, i, m], k) => chipEls[k + 1].classList.toggle('on', !!(st.b[i] & m)));
  $('#sticks').textContent = `左搖桿 x=${st.lx} y=${st.ly}    右搖桿 x=${st.rx} y=${st.ry}`;
  if (st.full) {
    st.touch.forEach((t, f) => {
      const el = $('.finger.f' + f);
      el.style.display = t ? 'flex' : 'none';
      if (t) { el.style.left = t.x / 1920 * 100 + '%'; el.style.top = t.y / 1080 * 100 + '%'; }
    });
    $('#tpinfo').textContent = st.touch.map((t, f) => t ? `${f + 1}: ${t.x}, ${t.y}` : '').filter(Boolean).join('  ') || '沒有手指';
    $('#pad').classList.toggle('click', !!(st.b[2] & 0x02));
    $('#dot').style.left = 50 + aim.x / 80 * 100 + '%'; $('#dot').style.top = 50 + aim.y / 45 * 100 + '%';
    const f = a => a.map(x => x.toFixed(2).padStart(7)).join(' ');
    $('#motion').textContent = `陀螺儀（度/秒） ${f(st.gyro.map((g, k) => g - bias[k]))}\n加速度計（g）   ${f(st.accel)}`;
    $('#battery').textContent = `電量約 ${st.battery}%` + (['', '（充電中）', '（已充滿）'][st.charging] ?? '');
  } else if (device) {
    $('#motion').textContent = $('#tpinfo').textContent = '藍牙簡易模式：沒有觸控板與陀螺儀資料。請重新連接。';
  }
  requestAnimationFrame(render);
}
requestAnimationFrame(render);

$('#recenter').onclick = () => { aim.x = aim.y = 0; };
$('#calib').onclick = () => { calibSamples = []; $('#calib').textContent = '校正中，請不要動…'; };

// ---------- 震動 ----------
let pulseTimers = [];
function setRumble(l, r) {
  rumble.l = l; rumble.r = r;
  $('#rumL').value = l; $('#rumR').value = r; $('#rlv').textContent = l; $('#rrv').textContent = r;
  queueSend();
}
function stopPulses() { pulseTimers.forEach(clearTimeout); pulseTimers = []; }
function pulse(steps) {          // steps: [[左, 右, 毫秒], ...]
  stopPulses();
  let t = 0;
  for (const [l, r, ms] of steps) { pulseTimers.push(setTimeout(() => setRumble(l, r), t)); t += ms; }
  pulseTimers.push(setTimeout(() => setRumble(0, 0), t));
}
for (const id of ['rumL', 'rumR']) $('#' + id).addEventListener('input', () => { stopPulses(); setRumble(+$('#rumL').value, +$('#rumR').value); });
document.querySelectorAll('[data-pulse]').forEach(btn => btn.onclick = () => {
  const d = btn.dataset.pulse;
  if (d === 'heartbeat') pulse([[180, 0, 90], [0, 0, 120], [255, 0, 110], [0, 0, 600], [180, 0, 90], [0, 0, 120], [255, 0, 110]]);
  else { const [l, r, ms] = d.split(',').map(Number); pulse([[l, r, ms]]); }
});
$('#rumOff').onclick = () => { stopPulses(); setRumble(0, 0); };

$('#connect').onclick = async () => {
  if (!navigator.hid) { setStatus('這個瀏覽器不支援 WebHID。請用電腦版 Chrome 或 Edge。', 'warn'); return; }
  try {
    const [d] = await navigator.hid.requestDevice({ filters: PRODUCTS.map(productId => ({ vendorId: VENDOR, productId })) });
    if (d) await openDevice(d);
  } catch (e) { setStatus('連接失敗：' + e.message, 'warn'); }
};

$('#reset').onclick = () => { for (const k of ['L2', 'R2']) { cards[k].mode.value = 'off'; refresh(k); } send(); };

if (navigator.hid) {
  navigator.hid.addEventListener('disconnect', e => {
    if (e.device === device) { stopPulses(); device = null; $('#reset').disabled = true; setStatus('手把已中斷連接', 'warn'); }
  });
  navigator.hid.getDevices().then(ds => {   // 之前授權過就自動連接
    const d = ds.find(x => x.vendorId === VENDOR && PRODUCTS.includes(x.productId));
    if (d) openDevice(d).catch(() => {});
  });
} else {
  setStatus('這個瀏覽器不支援 WebHID。請用電腦版 Chrome 或 Edge。', 'warn');
}
window.addEventListener('beforeunload', () => {
  if (device?.opened) { for (const k of ['L2', 'R2']) cards[k].mode.value = 'off'; rumble.l = rumble.r = 0; send(); }
});

// ---------- 介面 ----------
const cards = {};
const HINTS = {
  off: '沒有阻力。扳機像一般手把。',
  feedback: '從起始位置到底都有固定阻力。強度越高越難按。',
  weapon: '起始到結束位置之間有阻力。壓過結束位置後阻力瞬間消失，像扣扳機。',
  vibration: '從起始位置開始，扳機會震動。要按住扳機才感覺得到。頻率是 1 個位元組，只能是整數。',
  rawFeedback: '舊版持續阻力。位置與強度直接用 0–255。用來和「持續阻力」比較力道。',
  rawWeapon: '舊版扳機段落。起始、結束、強度直接用 0–255。',
};
// 區（zone）對應的按壓量。依實測：第 3 區約 95，第 5 區約 155。
const ZONE_OFFSET = 5, ZONE_WIDTH = 30;
const zoneRaw = k => Math.min(255, ZONE_OFFSET + ZONE_WIDTH * k);
const RANGES = {
  feedback:    { start: [0, 9], force: [1, 8] },
  weapon:      { start: [2, 7], end: [3, 8], force: [1, 8] },
  vibration:   { start: [0, 9], force: [1, 8], freq: [1, 255] },
  rawFeedback: { start: [0, 255], force: [0, 255] },
  rawWeapon:   { start: [0, 255], end: [0, 255], force: [0, 255] },
};
const DEFAULTS = {
  feedback:    { start: 2, force: 5 },
  weapon:      { start: 3, end: 5, force: 8 },
  vibration:   { start: 2, force: 6, freq: 30 },
  rawFeedback: { start: 60, force: 255 },
  rawWeapon:   { start: 90, end: 150, force: 255 },
};
const SHOW = { off: [], feedback: ['start', 'force'], weapon: ['start', 'end', 'force'], vibration: ['start', 'force', 'freq'],
  rawFeedback: ['start', 'force'], rawWeapon: ['start', 'end', 'force'] };

for (const key of ['L2', 'R2']) {
  const el = $('#tpl').content.firstElementChild.cloneNode(true);
  $('.name', el).textContent = key === 'L2' ? 'L2（左扳機）' : 'R2（右扳機）';
  const c = cards[key] = { el, mode: $('.mode', el), start: $('.start', el), end: $('.end', el), force: $('.force', el), freq: $('.freq', el) };
  for (const n of ['mode', 'start', 'end', 'force', 'freq']) {
    c[n].addEventListener('input', () => {
      if ($('#link').checked) copyCfg(key, key === 'L2' ? 'R2' : 'L2');
      refresh(key); queueSend();
    });
  }
  $('#cards').append(el);
  refresh(key);
}

function readCfg(key) {
  const c = cards[key];
  return { mode: c.mode.value, start: +c.start.value, end: +c.end.value, force: +c.force.value, freq: +c.freq.value };
}
function copyCfg(from, to) {
  cards[to].mode.value = cards[from].mode.value;
  refresh(to); // 先更新滑桿範圍，再複製數值
  for (const n of ['start', 'end', 'force', 'freq']) cards[to][n].value = cards[from][n].value;
  refresh(to);
}
function refresh(key) {
  const c = cards[key], mode = c.mode.value, R = RANGES[mode] || {}, raw = mode.startsWith('raw');
  for (const n in R) { c[n].min = R[n][0]; c[n].max = R[n][1]; }
  if (c.lastMode !== mode) {   // 換模式時套用該模式的預設值
    if (c.lastMode !== undefined) for (const [n, v] of Object.entries(DEFAULTS[mode] || {})) c[n].value = v;
    c.lastMode = mode;
  }
  if (mode === 'weapon') c.end.min = +c.start.value + 1;                 // 結束必須在起始之後
  if (mode === 'rawWeapon' && +c.end.value < +c.start.value) c.end.value = c.start.value;
  for (const n of ['start', 'end', 'force', 'freq']) {
    const wrap = $('.p-' + n, c.el), v = +c[n].value;
    wrap.classList.toggle('hidden', !SHOW[mode].includes(n));
    $('b', wrap).textContent = !raw && (n === 'start' || n === 'end') ? `第 ${v} 區（按壓量約 ${zoneRaw(v)}）` : v;
  }
  $('.hint', c.el).textContent = HINTS[mode];
  const z = $('.zone', c.el);
  if (mode === 'off') { z.style.width = '0'; return; }
  const s = raw ? +c.start.value : zoneRaw(+c.start.value);
  const e = mode === 'weapon' ? zoneRaw(+c.end.value) : mode === 'rawWeapon' ? +c.end.value : 255;
  z.style.left = s / 255 * 100 + '%'; z.style.width = Math.max(0, e - s) / 255 * 100 + '%';
}
function setMeter(key, v) {
  if (!cards[key]) return;
  const c = cards[key];
  $('.meter i', c.el).style.width = (v / 255 * 100) + '%';
  $('.val', c.el).textContent = v;
}

const PRESETS = {
  soft:   { mode: 'feedback', start: 1, force: 2 },
  hard:   { mode: 'feedback', start: 0, force: 8 },
  gun:    { mode: 'weapon', start: 3, end: 5, force: 8 },
  bow:    { mode: 'feedback', start: 2, force: 6 },
  engine: { mode: 'vibration', start: 2, force: 6, freq: 30 },
  rawmax: { mode: 'rawFeedback', start: 0, force: 255 },
};
document.querySelectorAll('[data-preset]').forEach(btn => btn.onclick = () => {
  const p = PRESETS[btn.dataset.preset];
  for (const key of ['L2', 'R2']) {
    cards[key].mode.value = p.mode;
    refresh(key); // 先更新滑桿範圍，再套用數值
    for (const [n, v] of Object.entries(p)) cards[key][n].value = v;
    refresh(key);
  }
  send();
});
for (const el of document.querySelectorAll('#color, #mic, #leds input')) el.addEventListener('input', queueSend);
$('#link').onchange = () => { if ($('#link').checked) { copyCfg('L2', 'R2'); queueSend(); } };
</script>
</body>
</html>
